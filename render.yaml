# Render Blueprint for the StockSense API (free plan).
# Render dashboard -> New -> Blueprint -> paste the repo URL. See DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: stocksense-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: NODE_ENV=production would otherwise skip typescript/prisma, which the build needs.
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon connection string (direct, not pooled)
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN # your Vercel URL, e.g. https://stocksense.vercel.app
        sync: false
      # Two proxies sit in front of the API (Vercel rewrite, then Render's load balancer),
      # so trust both hops to see the real client IP for rate limiting.
      - key: TRUST_PROXY
        value: "2"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      # Render's free tier blocks the usual SMTP ports (25/465/587); 2525 is open.
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
